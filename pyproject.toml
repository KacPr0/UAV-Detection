[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdet"
version = "0.1.0"
description = "Detekcja defektów modułów PV na skorelowanych obrazach RGB i termograficznych z UAV"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pvdet = "pvdet.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]  # macOS potrafi ukryć plik .pth w .venv, a Python 3.13 go wtedy pomija
